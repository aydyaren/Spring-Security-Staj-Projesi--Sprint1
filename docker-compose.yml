version: '3.8'

services:

  # PostgreSQL veritabanı servisi
  postgres:
    image: postgres:16
    container_name: sprintw1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sprint1_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: intren13
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Spring Boot uygulaması
  app:
    build: .
    container_name: sprintw1-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS}

      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads   # dosya yüklemeleri container silinse bile kalıcı olsun

volumes:
  postgres_data:
  uploads_data: